[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "powersys-data-prep"
version = "1.0.0"
description = "Power system data preparation for the iDesignRES case studies (NESP, Spain, North Sea)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "geopandas>=0.12",
    "shapely>=2.0",
    "folium>=0.14",
    "matplotlib>=3.6",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
powersys = "powersys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
